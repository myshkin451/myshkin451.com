<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="color-scheme" content="dark" />
    <title>Myshkin 451</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="site.css" />
    <script src="site.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到内容</a>
    <header class="site-header page-width">
      <a class="wordmark" href="index.html">Myshkin 451</a>
      <nav aria-label="主导航">
        <a href="#projects">项目</a>
        <a href="#writing">文字</a>
        <a href="about.html">关于</a>
      </nav>
    </header>
    <main id="main" class="page-width">
      <h1 class="visually-hidden">Myshkin 451 的项目与文字</h1>
      <section id="projects" aria-label="项目">
        <figure class="featured-work">
          <button
            class="feature-image image-link"
            type="button"
            data-open="image-dialog"
            aria-label="查看色散大图"
          >
            <img
              src="assets/dispersion.png"
              width="1774"
              height="887"
              alt="深色背景中的条纹玻璃环，表面映出琥珀色和浅蓝色的光"
              fetchpriority="high"
            />
          </button>
          <figcaption class="work-caption">
            <div>
              <h2><button type="button" data-open="image-dialog">色散</button></h2>
              <p>图像 · 2026</p>
            </div>
            <button
              class="arrow-button"
              type="button"
              data-open="image-dialog"
              aria-label="打开色散"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M6 5h13v13" /></svg>
            </button>
          </figcaption>
        </figure>
      </section>
      <div class="secondary-content">
        <figure class="small-work">
          <button
            class="torus-preview image-link"
            type="button"
            data-open="torus-dialog"
            aria-label="打开环面交互实验"
          >
            <svg
              id="torus-thumbnail"
              viewBox="0 0 800 440"
              role="img"
              aria-label="银灰色环面的线框图形"
            >
              <defs>
                <radialGradient id="shadow">
                  <stop stop-color="#a6abb9" stop-opacity=".12" />
                  <stop offset="1" stop-color="#a6abb9" stop-opacity="0" />
                </radialGradient>
              </defs>
              <ellipse cx="400" cy="355" rx="220" ry="30" fill="url(#shadow)" />
              <g id="thumbnail-lines" fill="none" stroke-linecap="round"></g>
            </svg>
          </button>
          <figcaption class="work-caption compact-caption">
            <div>
              <h2><button type="button" data-open="torus-dialog">环面</button></h2>
              <p>交互实验</p>
            </div>
            <button
              class="arrow-button"
              type="button"
              data-open="torus-dialog"
              aria-label="打开环面"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M6 5h13v13" /></svg>
            </button>
          </figcaption>
        </figure>
        <section id="writing" class="writing-index" aria-labelledby="writing-title">
          <h2 id="writing-title">文字</h2>
          <a class="writing-row" href="journal.html">
            <span>网站重做记录</span>
            <time datetime="2026-09-17">2026.09.17</time>
          </a>
        </section>
      </div>
      <noscript
        ><p class="muted">图像可直接查看；打开大图和环面实验需要启用 JavaScript。</p></noscript
      >
    </main>
    <footer class="site-footer page-width">
      <span>Myshkin 451</span>
      <span>设计预览 · 示例内容</span>
    </footer>

    <dialog id="image-dialog" class="image-dialog" aria-labelledby="image-title">
      <header class="dialog-header">
        <h2 id="image-title">色散</h2>
        <form method="dialog">
          <button class="close-button" aria-label="关闭大图" autofocus>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6" /></svg>
          </button>
        </form>
      </header>
      <div class="image-stage">
        <img src="assets/dispersion.png" width="1774" height="887" alt="条纹玻璃环大图" />
      </div>
      <footer class="image-details">
        <p>AI 生成图像 · 设计样例</p>
        <a href="assets/dispersion.png" download="dispersion.png"
          >下载图像 <span aria-hidden="true">↓</span></a
        >
      </footer>
    </dialog>

    <dialog id="torus-dialog" class="torus-dialog" aria-labelledby="torus-title">
      <header class="dialog-header">
        <h2 id="torus-title">环面</h2>
        <form method="dialog">
          <button class="close-button" aria-label="关闭实验" autofocus>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6" /></svg>
          </button>
        </form>
      </header>
      <div
        id="torus-stage"
        class="torus-stage"
        tabindex="0"
        role="group"
        aria-label="旋转环面"
        aria-describedby="interaction-hint"
      >
        <svg id="torus" viewBox="0 0 800 480" role="img" aria-label="可以旋转和调整粗细的线框环面">
          <g id="torus-lines" fill="none" stroke-linecap="round"></g>
        </svg>
      </div>
      <p id="interaction-hint" class="interaction-hint">拖动或使用方向键旋转</p>
      <div class="experiment-controls">
        <label class="thickness-control" for="thickness"
          ><span>粗细</span><input id="thickness" type="range" min="25" max="85" value="52"
        /></label>
        <fieldset class="color-control">
          <legend>颜色</legend>
          <label style="--swatch: #c7cbd4"
            ><input
              type="radio"
              name="color"
              value="silver"
              aria-label="银灰"
              checked /><span></span
          ></label>
          <label style="--swatch: #e8b783"
            ><input type="radio" name="color" value="amber" aria-label="琥珀" /><span></span
          ></label>
          <label style="--swatch: #a1bbdc"
            ><input type="radio" name="color" value="blue" aria-label="浅蓝" /><span></span
          ></label>
        </fieldset>
        <button id="rotate" class="text-control" type="button" aria-pressed="false">
          自动旋转
        </button>
        <button id="reset" class="text-control" type="button">重置</button>
      </div>
    </dialog>
  </body>
</html>
