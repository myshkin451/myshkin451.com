<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>确认邮箱</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f6f7f5;
      color: #222723;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 520px; background: #ffffff"
          >
            <tr>
              <td style="padding: 36px 28px">
                <div
                  style="width: 28px; height: 2px; background: #405a9e; margin-bottom: 28px"
                ></div>
                <h1
                  style="
                    font-family: Georgia, 'Songti SC', serif;
                    font-size: 28px;
                    font-weight: 400;
                    line-height: 1.4;
                    margin: 0 0 22px;
                  "
                >
                  确认邮箱
                </h1>
                <p style="font-size: 15px; line-height: 1.9; margin: 0 0 26px">
                  确认这个邮箱，完成注册。之后就可以登录并留言。
                </p>
                <p style="margin: 0 0 28px">
                  <a
                    href="{{ .ConfirmationURL }}"
                    style="
                      display: inline-block;
                      padding: 13px 24px;
                      background: #405a9e;
                      color: #ffffff;
                      text-decoration: none;
                      border-radius: 2px;
                      font-size: 15px;
                    "
                    >确认邮箱</a
                  >
                </p>
                <p style="font-size: 13px; line-height: 1.8; color: #68716a; margin: 0 0 24px">
                  如果这不是你的操作，忽略这封邮件即可。
                </p>
                <div style="border-top: 1px solid #e5e8e3; padding-top: 22px">
                  <p style="font-size: 12px; line-height: 1.8; color: #68716a; margin: 0 0 6px">
                    按钮无法打开时，复制以下地址到浏览器：
                  </p>
                  <p
                    style="
                      font-size: 12px;
                      line-height: 1.8;
                      word-break: break-all;
                      margin: 0 0 24px;
                    "
                  >
                    <a href="{{ .ConfirmationURL }}" style="color: #405a9e"
                      >{{ .ConfirmationURL }}</a
                    >
                  </p>
                  <a
                    href="{{ .SiteURL }}"
                    style="font-size: 12px; color: #68716a; text-decoration: none"
                    >返回网站 →</a
                  >
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
