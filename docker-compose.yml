services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: myshkin451
      POSTGRES_USER: myshkin451
      POSTGRES_PASSWORD: myshkin451
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myshkin451 -d myshkin451']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
